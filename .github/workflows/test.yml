name: Tests

on:
  push:
    branches:
      - '**'
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  tests:
    # Internal PRs are covered by the push workflow; only fork PRs need the
    # read-only pull_request run (their reports are published by workflow_run).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      pr_number: ${{ steps.find_pr.outputs.number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Remove checked-in coverage data
        run: rm -f .coverage .coverage.* coverage.xml coverage-term.txt diff-coverage.md

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmagic1 imagemagick

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov diff-cover pytest-playwright playwright==1.65.2 requests defusedxml

      - name: Install Playwright browsers
        if: always() && (hashFiles('tests/e2e/**') != '' || hashFiles('tests/functional/**') != '')
        run: playwright install --with-deps chromium

      - name: Run unit tests with coverage
        id: unit_tests
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          if [ -d tests/unit ]; then
            pytest tests/unit -q --cov=cps.cover_history --cov=cps.editbooks --cov=cps.helper --cov-report=term-missing --cov-report=xml:coverage.xml 2>&1 | tee unit-test-output.txt
          else
            echo "tests/unit not found; skipping unit tests." | tee unit-test-output.txt
          fi

      - name: Run Playwright E2E tests
        id: e2e_tests
        if: always()
        continue-on-error: true
        shell: bash
        env:
          CALIBRE_WEB_TEST_COVERAGE: "1"
        run: |
          set -o pipefail
          if [ -d tests/e2e ]; then
            pytest tests/e2e -q 2>&1 | tee e2e-test-output.txt
          else
            echo "tests/e2e not found; skipping Playwright E2E tests." | tee e2e-test-output.txt
          fi

      - name: Run HTTP functional tests
        id: functional_tests
        if: always()
        continue-on-error: true
        shell: bash
        env:
          CALIBRE_WEB_TEST_COVERAGE: "1"
        run: |
          set -o pipefail
          if [ -d tests/functional ]; then
            pytest tests/functional -q 2>&1 | tee functional-test-output.txt
          else
            echo "tests/functional not found; skipping HTTP functional tests." | tee functional-test-output.txt
          fi

      - name: Combine coverage data
        id: combine_coverage
        if: always()
        shell: bash
        run: bash .github/scripts/combine_coverage.sh

      - name: Find associated pull request
        if: always()
        id: find_pr
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const script = require('./.github/scripts/find_associated_pr.js');
            await script({ github, context, core });

      - name: Write PR changed files
        if: always() && steps.find_pr.outputs.number != ''
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ steps.find_pr.outputs.number }}
        with:
          script: |
            const fs = require('fs');
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER),
              per_page: 100,
            });
            fs.writeFileSync('changed-files.json', JSON.stringify(files, null, 2));

      - name: Generate coverage and test PR comment
        if: always()
        id: coverage_comment
        shell: bash
        env:
          CHANGED_FILES_JSON: changed-files.json
          COVERAGE_XML_PATH: coverage.xml
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python .github/scripts/test_coverage_comment.py > coverage-comment.md

      - name: Publish test and coverage summary
        if: always()
        shell: bash
        env:
          UNIT_OUTCOME: ${{ steps.unit_tests.outcome }}
          E2E_OUTCOME: ${{ steps.e2e_tests.outcome }}
          FUNCTIONAL_OUTCOME: ${{ steps.functional_tests.outcome }}
        run: python .github/scripts/test_summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage data artifact for fork PRs
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-data
          path: |
            coverage.xml
            coverage-term.txt
            diff-coverage.md
            unit-test-output.txt
            e2e-test-output.txt
            functional-test-output.txt
          if-no-files-found: warn
          retention-days: 5

      - name: Upload coverage report for PR body publisher
        if: always() && github.event_name == 'push' && steps.find_pr.outputs.number != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report-md
          path: coverage-comment.md
          if-no-files-found: warn
          retention-days: 5

      - name: Fail if any test suite failed
        if: always()
        shell: bash
        run: |
          failed=0
          if [ "${{ steps.unit_tests.outcome }}" != "success" ]; then echo "Unit tests: ${{ steps.unit_tests.outcome }}"; failed=1; fi
          if [ "${{ steps.e2e_tests.outcome }}" != "success" ]; then echo "Playwright E2E tests: ${{ steps.e2e_tests.outcome }}"; failed=1; fi
          if [ "${{ steps.functional_tests.outcome }}" != "success" ]; then echo "HTTP functional tests: ${{ steps.functional_tests.outcome }}"; failed=1; fi
          exit $failed

  report:
    name: PR report
    if: always() && github.event_name == 'push' && needs.tests.outputs.pr_number != ''
    needs: tests
    runs-on: ubuntu-latest
    # Serialize PR body writes across all quality workflows. Keep this group
    # identical to the one used by CodeQL, Semgrep, and Quality reports.
    concurrency:
      group: quality-pr-body
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download coverage report artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-report-md
          path: report
        continue-on-error: true

      - name: Update coverage report in PR body
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ needs.tests.outputs.pr_number }}
        with:
          script: |
            const fs = require('fs');
            const { updateReportAndRefreshTotals } = require('./.github/scripts/update_pr_body_reports.js');
            const path = 'report/coverage-comment.md';
            if (!fs.existsSync(path)) {
              core.info('coverage-comment.md not found; skipping PR body update.');
            } else {
              const content = fs.readFileSync(path, 'utf8');
              await updateReportAndRefreshTotals({
                github, context, core,
                pull_number: Number(process.env.PR_NUMBER),
                marker: '<!-- coverage-report -->',
                content,
              });
            }
