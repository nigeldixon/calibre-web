name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmagic1 imagemagick

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-playwright playwright==1.65.2 requests

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run unit tests
        run: pytest tests/unit -q

      - name: Run Playwright E2E tests
        run: pytest tests/e2e -q

      - name: Run HTTP functional tests
        run: pytest tests/functional -q
