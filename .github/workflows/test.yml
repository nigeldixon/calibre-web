name: Tests

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - develop
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmagic1 imagemagick

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov diff-cover pytest-playwright playwright==1.65.2 requests

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run unit tests with coverage
        id: unit_tests
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pytest tests/unit -q --cov=cps.cover_history --cov=cps.editbooks --cov=cps.helper --cov-report=term-missing --cov-report=xml:coverage.xml 2>&1 | tee unit-test-output.txt

      - name: Run Playwright E2E tests
        id: e2e_tests
        if: always()
        continue-on-error: true
        shell: bash
        env:
          CALIBRE_WEB_TEST_COVERAGE: "1"
        run: |
          set -o pipefail
          pytest tests/e2e -q 2>&1 | tee e2e-test-output.txt

      - name: Run HTTP functional tests
        id: functional_tests
        if: always()
        continue-on-error: true
        shell: bash
        env:
          CALIBRE_WEB_TEST_COVERAGE: "1"
        run: |
          set -o pipefail
          pytest tests/functional -q 2>&1 | tee functional-test-output.txt

      - name: Combine coverage data
        id: combine_coverage
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          # Combine parallel server-side coverage data (from functional/E2E) into .coverage
          server_cov=(.coverage.server* .coverage.*)
          if [ ${#server_cov[@]} -gt 0 ]; then
            python -m coverage combine --append "${server_cov[@]}" 2>&1 || true
          else
            python -m coverage combine 2>&1 || true
          fi
          if [ -f .coverage ] || [ ${#server_cov[@]} -gt 0 ]; then
            python -m coverage xml -o coverage.xml || true
            python -m coverage report -m --include="*/cps/*" --omit="*/tests/*" > coverage-term.txt 2>&1 || true
          fi

      - name: Find associated pull request
        if: always()
        id: find_pr
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            if (context.eventName === 'pull_request') {
              core.setOutput('number', context.payload.pull_request.number.toString());
              core.setOutput('base', context.payload.pull_request.base.ref || 'develop');
              return;
            }
            const branch = context.ref.replace('refs/heads/', '');
            const head = `${owner}:${branch}`;
            const pulls = await github.rest.pulls.list({ owner, repo, head, state: 'open' });
            if (pulls.data.length > 0) {
              core.setOutput('number', pulls.data[0].number.toString());
              core.setOutput('base', pulls.data[0].base.ref || 'develop');
            } else {
              core.setOutput('number', '');
              core.setOutput('base', 'develop');
            }

      - name: Generate coverage and test PR comment
        if: always()
        id: coverage_comment
        shell: bash
        env:
          BASE_REF: ${{ steps.find_pr.outputs.base || github.base_ref || 'develop' }}
          UNIT_OUTCOME: ${{ steps.unit_tests.outcome }}
          E2E_OUTCOME: ${{ steps.e2e_tests.outcome }}
          FUNCTIONAL_OUTCOME: ${{ steps.functional_tests.outcome }}
        run: |
          python - <<'PY' > coverage-comment.md
          import os
          import re
          import subprocess
          import xml.etree.ElementTree as ET

          marker = "<!-- coverage-report -->"
          xml_path = "coverage.xml"
          base_ref = os.environ.get("BASE_REF", "develop").strip() or "develop"

          def pct_to_color(p):
              if p >= 90:
                  return "brightgreen", "🟢", "Good"
              if p >= 80:
                  return "green", "🟢", "Good"
              if p >= 70:
                  return "yellow", "🟡", "Fair"
              if p >= 50:
                  return "orange", "🟠", "Poor"
              return "red", "🔴", "Poor"

          def bar(p, width=20):
              filled = int(round((p / 100.0) * width))
              filled = max(0, min(width, filled))
              return "█" * filled + "░" * (width - filled)

          def badge(pct_i, color):
              return f"![coverage](https://img.shields.io/badge/coverage-{pct_i}%25-{color})"

          def status_icon(outcome):
              if outcome == "success":
                  return "✅"
              if outcome == "failure":
                  return "❌"
              if outcome in ("skipped", "cancelled"):
                  return "⏭️"
              return "⚪"

          def extract_summary(path):
              if not os.path.exists(path):
                  return "no results"
              try:
                  with open(path, "r", encoding="utf-8", errors="replace") as f:
                      content = f.read()
              except Exception:
                  return "no results"
              # Prefer the standard pytest short summary line near the end.
              for line in reversed([ln.strip() for ln in content.splitlines() if ln.strip()]):
                  if re.search(r"\b(passed|failed|error|errors|skipped|xfailed|xpassed|deselected|warnings?)\b", line) and re.search(r"\b(in|no tests ran)\b", line):
                      return line
                  if line.startswith("no tests ran"):
                      return line
              for line in reversed([ln.strip() for ln in content.splitlines() if ln.strip()]):
                  if re.search(r"\b(passed|failed|error|errors|skipped)\b", line):
                      return line
              return "no results"

          lines_out = [marker, "## Patch coverage"]

          if not os.path.exists(xml_path):
              lines_out += ["", "No coverage data was generated for this run."]
              print("\n".join(lines_out))
              raise SystemExit(0)

          # Diff/patch coverage via diff-cover
          diff_md_path = "diff-coverage.md"
          compare_branch = f"origin/{base_ref}"
          diff_pct = None
          diff_pct_i = None
          diff_total = None
          diff_missing = None
          diff_md = ""
          try:
              candidates = [["diff-cover"], ["python3", "-m", "diff_cover.diff_cover_tool"], ["python", "-m", "diff_cover.diff_cover_tool"]]
              diff_base = None
              for cand in candidates:
                  try:
                      probe = subprocess.run(cand + ["--help"], capture_output=True, text=True)
                      if probe.returncode == 0:
                          diff_base = cand
                          break
                  except Exception:
                      pass
              if diff_base is None:
                  raise RuntimeError("diff-cover command not available")

              cmd = diff_base + [xml_path, "--compare-branch", compare_branch, "--format", f"markdown:{diff_md_path}"]
              subprocess.run(cmd, capture_output=True, text=True)
              # console summary for parsing
              summary_cmd = diff_base + [xml_path, "--compare-branch", compare_branch]
              res2 = subprocess.run(summary_cmd, capture_output=True, text=True)
              out = (res2.stdout or "") + "\n" + (res2.stderr or "")
              m_cov = re.search(r"Coverage:\s*([0-9]+(?:\.[0-9]+)?)%", out)
              m_total = re.search(r"Total:\s*([0-9]+)\s*lines", out)
              m_miss = re.search(r"Missing:\s*([0-9]+)\s*lines", out)
              if m_cov:
                  diff_pct = float(m_cov.group(1))
                  diff_pct_i = int(round(diff_pct))
              if m_total:
                  diff_total = int(m_total.group(1))
              if m_miss:
                  diff_missing = int(m_miss.group(1))
              if os.path.exists(diff_md_path):
                  with open(diff_md_path, "r", encoding="utf-8") as f:
                      diff_md = f.read().strip()
          except Exception:
              diff_md = ""
              diff_pct = None

          lines_out += [
              "",
              f"Diff vs `{compare_branch}` (changed/diff lines present in the combined coverage report).",
          ]
          if diff_pct is not None:
              d_color, d_emoji, d_label = pct_to_color(diff_pct)
              lines_out += [
                  "",
                  f"{badge(diff_pct_i, d_color)} **{diff_pct}%** ({d_label}) {d_emoji}",
                  "",
                  f"`{bar(diff_pct_i)}` {diff_pct_i}%",
              ]
              if diff_total is not None and diff_missing is not None:
                  lines_out.append("")
                  lines_out.append(f"**Diff lines:** {diff_total} &nbsp;|&nbsp; **Missing:** {diff_missing} &nbsp;|&nbsp; **Covered:** {max(0, diff_total - diff_missing)}")
          else:
              lines_out += [
                  "",
                  "_Patch coverage could not be computed for this run._",
              ]

          if diff_md:
              lines_out += [
                  "",
                  "<details><summary>Diff coverage details</summary>",
                  "",
                  diff_md,
                  "",
                  "</details>",
              ]
          print("\n".join(lines_out))
          PY

      - name: Publish test and coverage summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Test results"
            echo
            echo "| Status | Suite | Tests (pass/fail summary) |"
            echo "|:------:|-------|----------------------------|"
            for row in \
              "unit_tests|Unit (in-process)|unit-test-output.txt" \
              "e2e_tests|Playwright E2E|e2e-test-output.txt" \
              "functional_tests|HTTP functional|functional-test-output.txt"; do
              IFS='|' read -r step name file <<< "$row"
              outcome="${{ steps.unit_tests.outcome }}" # placeholder, replaced below per step
            done
          } >/dev/null 2>&1 || true
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os, re
          def status_icon(outcome):
              if outcome == "success":
                  return "✅"
              if outcome == "failure":
                  return "❌"
              if outcome in ("skipped", "cancelled"):
                  return "⏭️"
              return "⚪"
          def extract_summary(path):
              if not os.path.exists(path):
                  return "no results"
              try:
                  with open(path, "r", encoding="utf-8", errors="replace") as f:
                      content = f.read()
              except Exception:
                  return "no results"
              for line in reversed([ln.strip() for ln in content.splitlines() if ln.strip()]):
                  if re.search(r"\b(passed|failed|error|errors|skipped|xfailed|xpassed|deselected|warnings?)\b", line) and re.search(r"\b(in|no tests ran)\b", line):
                      return line
                  if line.startswith("no tests ran"):
                      return line
              for line in reversed([ln.strip() for ln in content.splitlines() if ln.strip()]):
                  if re.search(r"\b(passed|failed|error|errors|skipped)\b", line):
                      return line
              return "no results"
          suites = [
              ("Unit (in-process)", os.environ.get("UNIT_OUTCOME",""), "unit-test-output.txt"),
              ("Playwright E2E", os.environ.get("E2E_OUTCOME",""), "e2e-test-output.txt"),
              ("HTTP functional", os.environ.get("FUNCTIONAL_OUTCOME",""), "functional-test-output.txt"),
          ]
          print("## Test results")
          print()
          print("| Status | Suite | Tests (pass/fail summary) |")
          print("|:------:|-------|----------------------------|")
          for name, outcome, path in suites:
              print(f"| {status_icon(outcome)} | {name} | `{extract_summary(path).replace('|','\\|')}` |")
          print()
          print("## Test coverage (combined)")
          print()
          print("Combined coverage from in-process unit tests and server-side functional/E2E runs when coverage data is available.")
          print()
          print("```text")
          if os.path.exists("coverage-term.txt"):
              try:
                  with open("coverage-term.txt", "r", encoding="utf-8", errors="replace") as f:
                      txt = f.read().rstrip()
                  print(txt if txt else "No coverage data generated.")
              except Exception:
                  print("No coverage data generated.")
          elif os.path.exists(".coverage"):
              try:
                  import subprocess
                  r = subprocess.run(["python","-m","coverage","report","-m","--include=*/cps/*","--omit=*/tests/*"], capture_output=True, text=True)
                  print((r.stdout or r.stderr or "No coverage data generated.").rstrip())
              except Exception:
                  print("No coverage data generated.")
          else:
              print("No coverage data generated.")
          print("```")
          if os.path.exists("diff-coverage.md"):
              print()
              print("## Patch coverage (PR diff)")
              print()
              with open("diff-coverage.md","r",encoding="utf-8",errors="replace") as f:
                  print(f.read().rstrip())
          PY
        env:
          UNIT_OUTCOME: ${{ steps.unit_tests.outcome }}
          E2E_OUTCOME: ${{ steps.e2e_tests.outcome }}
          FUNCTIONAL_OUTCOME: ${{ steps.functional_tests.outcome }}

      - name: Comment coverage and test results on PR
        if: always() && steps.find_pr.outputs.number != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage-report
          number: ${{ steps.find_pr.outputs.number }}
          path: coverage-comment.md

      - name: Fail if any test suite failed
        if: always()
        shell: bash
        run: |
          failed=0
          if [ "${{ steps.unit_tests.outcome }}" != "success" ]; then echo "Unit tests: ${{ steps.unit_tests.outcome }}"; failed=1; fi
          if [ "${{ steps.e2e_tests.outcome }}" != "success" ]; then echo "Playwright E2E tests: ${{ steps.e2e_tests.outcome }}"; failed=1; fi
          if [ "${{ steps.functional_tests.outcome }}" != "success" ]; then echo "HTTP functional tests: ${{ steps.functional_tests.outcome }}"; failed=1; fi
          exit $failed
