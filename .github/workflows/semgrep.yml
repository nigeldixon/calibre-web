name: Semgrep

on:
  push:
    branches:
      - '**'
  schedule:
    - cron: '45 5 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Find associated pull request
        id: find_pr
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { owner, repo } = context.repo;
            if (context.eventName === 'pull_request') {
              const pr = context.payload.pull_request;
              core.setOutput('number', pr.number.toString());
              core.setOutput('base_sha', pr.base.sha || '');
              core.setOutput('head_sha', pr.head.sha || '');
              core.setOutput('base_ref', pr.base.ref || '');
              return;
            }
            if (context.eventName !== 'push') {
              core.setOutput('number', '');
              core.setOutput('base_sha', '');
              core.setOutput('head_sha', '');
              core.setOutput('base_ref', '');
              return;
            }
            const branch = context.ref.replace('refs/heads/', '');
            const head = `${owner}:${branch}`;
            const pulls = await github.rest.pulls.list({ owner, repo, head, state: 'open', per_page: 100 });
            if (pulls.data.length > 0) {
              const pr = pulls.data[0];
              core.setOutput('number', pr.number.toString());
              core.setOutput('base_sha', pr.base.sha || '');
              core.setOutput('head_sha', pr.head.sha || '');
              core.setOutput('base_ref', pr.base.ref || '');
            } else {
              core.setOutput('number', '');
              core.setOutput('base_sha', '');
              core.setOutput('head_sha', '');
              core.setOutput('base_ref', '');
            }

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          python -m pip install semgrep

      - name: Run Semgrep (raw SARIF)
        shell: bash
        run: |
          mkdir -p semgrep-results
          semgrep scan \
            --config p/default \
            --config p/python \
            --config p/javascript \
            --metrics=off \
            --sarif --output semgrep-results/semgrep.raw.sarif \
            . || true

      - name: Filter SARIF to PR-changed files
        if: always()
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ steps.find_pr.outputs.base_sha || github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ steps.find_pr.outputs.head_sha || github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ steps.find_pr.outputs.base_ref || github.event.pull_request.base.ref }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys

          raw_path = 'semgrep-results/semgrep.raw.sarif'
          out_path = 'semgrep-results/semgrep.sarif'
          scope_path = 'semgrep-results/scope.json'

          if not os.path.exists(raw_path):
              with open(out_path, 'w', encoding='utf-8') as f:
                  json.dump({"version": "2.1.0", "runs": []}, f)
              with open(scope_path, 'w', encoding='utf-8') as f:
                  json.dump({'scoped': False, 'reason': 'no_sarif', 'changed_count': 0, 'base': '', 'head': ''}, f)
              sys.exit(0)

          with open(raw_path, 'r', encoding='utf-8') as f:
              sarif = json.load(f)

          event = os.environ.get('EVENT_NAME', '')
          base = (os.environ.get('PR_BASE_SHA') or '').strip()
          head = (os.environ.get('PR_HEAD_SHA') or '').strip()
          base_ref = (os.environ.get('PR_BASE_REF') or '').strip()
          changed = None
          reason = 'full_scan'

          if event in ('pull_request', 'push') and base and head:
              try:
                  if base_ref:
                      subprocess.run(['git', 'fetch', 'origin', base_ref, '--depth=1'], check=False, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  subprocess.run(['git', 'fetch', 'origin', base, '--depth=1'], check=False, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  subprocess.run(['git', 'fetch', 'origin', head, '--depth=1'], check=False, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  diff = subprocess.run(['git', 'diff', '--name-only', f'{base}...{head}'], check=False, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
                  if diff.returncode != 0:
                      diff = subprocess.run(['git', 'diff', '--name-only', base, head], check=False, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
                  if diff.returncode == 0:
                      changed = set()
                      for line in (diff.stdout or '').splitlines():
                          line = line.strip().replace('\\', '/')
                          if line:
                              changed.add(line)
                              if line.startswith('./'):
                                  changed.add(line[2:])
                      reason = 'pr_changed_files'
                  else:
                      reason = 'diff_failed_full_scan'
              except Exception:
                  changed = None
                  reason = 'diff_failed_full_scan'

          def norm(uri):
              if not uri:
                  return ''
              uri = uri.replace('\\', '/')
              while uri.startswith('./'):
                  uri = uri[2:]
              return uri

          def in_changed(result, changed_set):
              if changed_set is None:
                  return True
              locs = list(result.get('locations') or []) + list(result.get('relatedLocations') or [])
              if not locs:
                  return False
              for loc in locs:
                  phys = (loc or {}).get('physicalLocation') or {}
                  art = phys.get('artifactLocation') or {}
                  uri = norm(art.get('uri', ''))
                  if uri in changed_set:
                      return True
              return False

          if changed is not None:
              for run in sarif.get('runs', []) or []:
                  results = run.get('results', []) or []
                  run['results'] = [r for r in results if in_changed(r, changed)]

          with open(out_path, 'w', encoding='utf-8') as f:
              json.dump(sarif, f)

          scope = {
              'scoped': changed is not None,
              'reason': reason,
              'changed_count': (len(changed) if changed is not None else 0),
              'base': base,
              'head': head,
          }
          with open(scope_path, 'w', encoding='utf-8') as f:
              json.dump(scope, f)
          print(json.dumps(scope))
          PY

      - name: Upload SARIF to code scanning
        if: always() && hashFiles('semgrep-results/semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: semgrep-results/semgrep.sarif
          category: semgrep

      - name: Upload Semgrep artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-results
          path: semgrep-results/
          if-no-files-found: warn
          retention-days: 5

  comment:
    name: PR comment
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'push'
    needs: analyze
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Find associated pull request
        id: find_pr
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { owner, repo } = context.repo;
            if (context.eventName === 'pull_request') {
              const pr = context.payload.pull_request;
              core.setOutput('number', pr.number.toString());
              return;
            }
            if (context.eventName !== 'push') {
              core.setOutput('number', '');
              return;
            }
            const branch = context.ref.replace('refs/heads/', '');
            const head = `${owner}:${branch}`;
            const pulls = await github.rest.pulls.list({ owner, repo, head, state: 'open', per_page: 100 });
            if (pulls.data.length > 0) {
              core.setOutput('number', pulls.data[0].number.toString());
            } else {
              core.setOutput('number', '');
            }

      - name: Download Semgrep artifacts
        if: steps.find_pr.outputs.number != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: semgrep-results
          path: semgrep-results
        continue-on-error: true

      - name: Generate Semgrep PR comment
        if: steps.find_pr.outputs.number != ''
        shell: bash
        run: |
          python - <<'PY' > semgrep-comment.md
          import json, os

          marker = '<!-- semgrep-report -->'
          sarif_path = 'semgrep-results/semgrep.sarif'
          scope_path = 'semgrep-results/scope.json'

          sarif = None
          if os.path.exists(sarif_path):
              try:
                  with open(sarif_path, 'r', encoding='utf-8') as f:
                      sarif = json.load(f)
              except Exception:
                  sarif = None

          scope = {'scoped': False, 'reason': 'unknown', 'changed_count': 0, 'base': '', 'head': ''}
          if os.path.exists(scope_path):
              try:
                  with open(scope_path, 'r', encoding='utf-8') as f:
                      scope = json.load(f)
              except Exception:
                  pass

          totals = {'results': 0, 'error': 0, 'warning': 0, 'note': 0}
          if sarif is not None:
              for run in sarif.get('runs', []) or []:
                  for r in run.get('results', []) or []:
                      totals['results'] += 1
                      level = (r.get('level') or 'warning').lower()
                      if level == 'error':
                          totals['error'] += 1
                      elif level in ('note', 'none'):
                          totals['note'] += 1
                      else:
                          totals['warning'] += 1

          def status_icon(n):
              return '✅' if n == 0 else '⚠️'

          lines = [marker, '## Semgrep analysis', '']
          if scope.get('scoped'):
              lines.append('Automated Semgrep summary for files changed in this PR (filtered SARIF). See the **Security** tab / code scanning alerts and workflow logs for full details.')
          elif scope.get('reason') == 'diff_failed_full_scan':
              lines.append('Automated Semgrep summary (could not determine PR diff; showing unfiltered/full scan results). See the **Security** tab / code scanning alerts and workflow logs for full details.')
          elif os.environ.get('GITHUB_EVENT_NAME') == 'schedule':
              lines.append('Automated Semgrep summary (scheduled full scan). See the **Security** tab / code scanning alerts and workflow logs for full details.')
          else:
              lines.append('Automated Semgrep summary. See the **Security** tab / code scanning alerts and workflow logs for full details.')

          lines += [
              '',
              '| Status | Results | Error | Warning | Note |',
              '|:------:|--------:|------:|--------:|-----:|',
          ]

          if sarif is None:
              lines.append('| ⚪ | - | - | - | - |')
          else:
              lines.append(f"| {status_icon(totals['results'])} | {totals['results']} | {totals['error']} | {totals['warning']} | {totals['note']} |")

          analyze_outcome = '${{ needs.analyze.result }}'
          lines += ['', f'**Analyze job:** `{analyze_outcome}`']

          if scope.get('scoped'):
              base = (scope.get('base') or '')[:7]
              head = (scope.get('head') or '')[:7]
              lines += ['', f"_Scope: {scope.get('changed_count', 0)} changed file(s) in this PR (`{base}...{head}`)._"]

          if sarif is None and not os.path.exists(sarif_path):
              lines += ['', '_No Semgrep SARIF was found for this run; results may be unavailable._']

          print('\n'.join(lines))
          PY

      - name: Comment Semgrep results on PR
        if: steps.find_pr.outputs.number != '' && hashFiles('semgrep-comment.md') != ''
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: semgrep-report
          number: ${{ steps.find_pr.outputs.number }}
          path: semgrep-comment.md
