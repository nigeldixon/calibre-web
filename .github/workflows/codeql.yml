name: CodeQL

on:
  push:
    branches:
      - '**'
  pull_request_target:
    types:
      - opened
      - reopened
  schedule:
    - cron: '30 5 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  placeholder-comment:
    name: Placeholder PR comments
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Create or update pending CodeQL comment
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: codeql-report
          number: ${{ github.event.pull_request.number }}
          message: |
            <!-- codeql-report -->
            ## CodeQL analysis

            ⏳ CodeQL analysis is queued/running. Results will appear here when the workflow completes.

      - name: Create or update pending Semgrep comment
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: semgrep-report
          number: ${{ github.event.pull_request.number }}
          message: |
            <!-- semgrep-report -->
            ## Semgrep analysis

            ⏳ Semgrep analysis is queued/running. Results will appear here when the workflow completes.

      - name: Create or update pending coverage comment
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: coverage-report
          number: ${{ github.event.pull_request.number }}
          message: |
            <!-- coverage-report -->
            ## Patch coverage

            ⏳ Tests are queued/running. Coverage and test results will appear here when the workflow completes.

  analyze:
    if: github.event_name != 'pull_request_target'
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: "/language:${{ matrix.language }}"
          output: codeql-results/${{ matrix.language }}
          upload: always

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: codeql-results/${{ matrix.language }}/*.sarif
          if-no-files-found: warn
          retention-days: 5

  comment:
    name: PR comment
    runs-on: ubuntu-latest
    if: always() && github.event_name != 'pull_request_target'
    needs: analyze
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Find associated pull request
        id: find_pr
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { owner, repo } = context.repo;
            if (context.eventName === 'pull_request') {
              const pr = context.payload.pull_request;
              core.setOutput('number', pr.number.toString());
              core.setOutput('base_sha', pr.base.sha || '');
              core.setOutput('head_sha', pr.head.sha || '');
              core.setOutput('base_ref', pr.base.ref || '');
              return;
            }
            if (context.eventName !== 'push') {
              core.setOutput('number', '');
              core.setOutput('base_sha', '');
              core.setOutput('head_sha', '');
              core.setOutput('base_ref', '');
              return;
            }
            const branch = context.ref.replace('refs/heads/', '');
            const head = `${owner}:${branch}`;
            const pulls = await github.rest.pulls.list({ owner, repo, head, state: 'open', per_page: 100 });
            if (pulls.data.length > 0) {
              const pr = pulls.data[0];
              core.setOutput('number', pr.number.toString());
              core.setOutput('base_sha', pr.base.sha || '');
              core.setOutput('head_sha', pr.head.sha || '');
              core.setOutput('base_ref', pr.base.ref || '');
            } else {
              core.setOutput('number', '');
              core.setOutput('base_sha', '');
              core.setOutput('head_sha', '');
              core.setOutput('base_ref', '');
            }

      - name: Checkout repository
        if: steps.find_pr.outputs.number != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Download SARIF artifacts
        if: steps.find_pr.outputs.number != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: codeql-sarif-*
          path: codeql-results
          merge-multiple: false
        continue-on-error: true

      - name: Generate CodeQL PR comment
        if: steps.find_pr.outputs.number != ''
        id: codeql_comment
        shell: bash
        env:
          PR_BASE_SHA: ${{ steps.find_pr.outputs.base_sha }}
          PR_HEAD_SHA: ${{ steps.find_pr.outputs.head_sha }}
          PR_BASE_REF: ${{ steps.find_pr.outputs.base_ref }}
          ANALYZE_RESULT: ${{ needs.analyze.result }}
        run: python .github/scripts/codeql_pr_comment.py > codeql-comment.md

      - name: Comment CodeQL results on PR
        if: steps.find_pr.outputs.number != ''
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: codeql-report
          number: ${{ steps.find_pr.outputs.number }}
          path: codeql-comment.md
