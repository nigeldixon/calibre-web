name: CodeQL

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - develop
      - master
  schedule:
    - cron: '30 5 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          output: codeql-results/${{ matrix.language }}
          upload: always

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: codeql-results/${{ matrix.language }}/*.sarif
          if-no-files-found: warn
          retention-days: 5

  comment:
    name: PR comment
    runs-on: ubuntu-latest
    if: always()
    needs: analyze
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Download SARIF artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: codeql-sarif-*
          path: codeql-results
          merge-multiple: false
        continue-on-error: true

      - name: Find associated pull request
        id: find_pr
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            if (context.eventName === 'pull_request') {
              core.setOutput('number', context.payload.pull_request.number.toString());
              return;
            }
            if (context.eventName !== 'push') {
              core.setOutput('number', '');
              return;
            }
            const branch = context.ref.replace('refs/heads/', '');
            const head = `${owner}:${branch}`;
            const pulls = await github.rest.pulls.list({ owner, repo, head, state: 'open' });
            if (pulls.data.length > 0) {
              core.setOutput('number', pulls.data[0].number.toString());
            } else {
              core.setOutput('number', '');
            }

      - name: Generate CodeQL PR comment
        if: steps.find_pr.outputs.number != ''
        id: codeql_comment
        shell: bash
        run: |
          python - <<'PY' > codeql-comment.md
          import glob
          import json
          import os

          marker = "<!-- codeql-report -->"
          sarif_files = sorted(glob.glob("codeql-results/**/*.sarif", recursive=True))
          analyze_outcomes = ${{ toJSON(needs.analyze.result) }}

          by_lang = {}
          for path in sarif_files:
              # path like codeql-results/codeql-sarif-python/python.sarif
              parts = path.replace("\\", "/").split("/")
              lang = "unknown"
              for p in parts:
                  if p.startswith("codeql-sarif-"):
                      lang = p.replace("codeql-sarif-", "")
                      break
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      sarif = json.load(f)
              except Exception:
                  by_lang.setdefault(lang, {"results": 0, "error": 0, "warning": 0, "note": 0, "parse_error": True})
                  continue
              info = by_lang.setdefault(lang, {"results": 0, "error": 0, "warning": 0, "note": 0, "parse_error": False})
              for run in sarif.get("runs", []) or []:
                  results = run.get("results", []) or []
                  info["results"] += len(results)
                  for r in results:
                      level = (r.get("level") or "warning").lower()
                      if level in ("error",):
                          info["error"] += 1
                      elif level in ("warning",):
                          info["warning"] += 1
                      elif level in ("note", "none"):
                          info["note"] += 1
                      else:
                          info["warning"] += 1

          def status_icon(count):
              return "✅" if count == 0 else "⚠️"

          lines = [
              marker,
              "## CodeQL analysis",
              "",
              "Automated CodeQL summary for this PR (generated from analysis SARIF). See the **Security** tab / code scanning alerts and workflow logs for full details.",
              "",
              "| Status | Language | Results | Error | Warning | Note |",
              "|:------:|----------|--------:|------:|--------:|-----:|",
          ]

          if by_lang:
              for lang in sorted(by_lang):
                  info = by_lang[lang]
                  if info.get("parse_error"):
                      lines.append(f"| ⚪ | `{lang}` | - | - | - | - |")
                  else:
                      lines.append(
                          f"| {status_icon(info['results'])} | `{lang}` | {info['results']} | {info['error']} | {info['warning']} | {info['note']} |"
                      )
          else:
              # matrix/result fallback
              lines.append(f"| ⚪ | - | - | - | - | - |")

          total = sum(v.get("results", 0) for v in by_lang.values() if not v.get("parse_error"))
          lines += [
              "",
              f"**Total results:** {total}",
              "",
              f"**Analyze job:** `{analyze_outcomes}`",
          ]

          if not sarif_files:
              lines += [
                  "",
                  "_No SARIF artifacts were found for this run; results may be unavailable (analysis may have failed or not produced output)._",
              ]

          print("\n".join(lines))
          PY

      - name: Comment CodeQL results on PR
        if: steps.find_pr.outputs.number != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: codeql-report
          number: ${{ steps.find_pr.outputs.number }}
          path: codeql-comment.md
